<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's Collection</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #0a0b0f;
    --bg2: #111319;
    --panel: #161922;
    --panel2: #1d212c;
    --border: #262b38;
    --border-hover: #3a4258;
    --text: #eef0f5;
    --text-dim: #8b91a3;
    --accent: #6d8dff;
    --accent2: #a06dff;
    --accent-glow: rgba(109,141,255,0.35);
    --good: #22c55e;
    --good-glow: rgba(34,197,94,0.35);
    --warn: #f5a623;
    --danger: #ef4444;
    --radius: 14px;
  }
  html[data-theme="light"] {
    --bg: #f2f4f9;
    --bg2: #e7eaf2;
    --panel: #ffffff;
    --panel2: #f3f5fa;
    --border: #dde1ea;
    --border-hover: #c3cadb;
    --text: #171923;
    --text-dim: #5b6272;
    --accent: #4a6ef0;
    --accent2: #8b4fe0;
    --accent-glow: rgba(74,110,240,0.20);
    --good: #16a34a;
    --good-glow: rgba(22,163,74,0.20);
    --warn: #b8720a;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(109,141,255,0.10), transparent 60%),
      radial-gradient(900px 400px at 90% 0%, rgba(160,109,255,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10,11,15,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
  }
  html[data-theme="light"] header { background: rgba(242,244,249,0.85); }
  header::after {
    content: "";
    display: block;
    height: 2px;
    margin-top: 14px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
    opacity: 0.6;
    border-radius: 2px;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--text), var(--accent) 60%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  header .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .controls input[type="text"],
  .controls select {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .controls input[type="text"]:focus,
  .controls select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .controls input[type="text"] { flex: 1; min-width: 200px; }
  .check-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .check-label.admin-only { display: none; }
  .icon-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-hover); }
  .icon-btn.admin-only { display: none; }
  .lock-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .lock-btn.unlocked {
    background: linear-gradient(135deg, rgba(34,197,94,0.18), rgba(34,197,94,0.08));
    border-color: rgba(34,197,94,0.5);
    color: #1f9d55;
    box-shadow: 0 0 14px rgba(34,197,94,0.2);
  }
  html[data-theme="dark"] .lock-btn.unlocked, :root:not([data-theme]) .lock-btn.unlocked { color: #6ee69f; }
  .stats {
    display: flex;
    gap: 18px;
    margin-left: auto;
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .stats b { color: var(--text); }
  main {
    padding: 24px 24px 60px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 18px;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    main { padding: 16px 12px 40px; }
    header { padding: 14px 14px; }
    .card .body { padding: 7px 7px 8px; gap: 3px; }
    .card .name { font-size: 11px; line-height: 1.2; }
    .card .meta { font-size: 9.5px; }
    .card .flags { font-size: 9px; }
    .value-badge { font-size: 9.5px; padding: 2px 6px; top: 5px; right: 5px; }
    .edited-badge, .deleted-badge, .dup-badge { font-size: 8px; padding: 1px 5px; bottom: 5px; }
    .fav-btn { font-size: 15px; top: 4px; left: 4px; width: 26px; height: 26px; }
    .card .actions { gap: 4px; padding-top: 6px; }
    .btn { font-size: 9.5px; padding: 6px 6px; }
    .link-row .edit-btn, .link-row .remove-btn { font-size: 9px; padding: 5px 6px; }
    .not-listed { font-size: 9.5px; padding: 5px 0; }
  }
  @media (max-width: 460px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 28px rgba(0,0,0,0.25), 0 0 0 1px rgba(109,141,255,0.15);
  }
  .card.is-deleted { opacity: 0.45; border-style: dashed; border-color: var(--danger); }
  .card .imgwrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  .card img:hover { transform: scale(1.04); }
  .card .noimg { color: var(--text-dim); font-size: 12px; padding: 8px; text-align: center; }
  .fav-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.45);
    color: #ffd25c;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  .fav-btn.active { background: rgba(255,210,92,0.18); border-color: rgba(255,210,92,0.5); }
  .carousel-dots {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; background: rgba(0,0,0,0.35); padding: 4px 7px; border-radius: 999px;
  }
  .carousel-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.45); cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; }
  .carousel-dots .dot.active { background: #fff; transform: scale(1.25); }
  .value-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: linear-gradient(135deg, rgba(34,197,94,0.28), rgba(34,197,94,0.14));
    color: var(--good);
    border: 1px solid rgba(34,197,94,0.45);
    font-size: 12px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(34,197,94,0.15);
  }
  .edited-badge {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(245,166,35,0.18); color: var(--warn);
    border: 1px solid rgba(245,166,35,0.45);
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  }
  .deleted-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(239,68,68,0.2); color: #ff8b8b;
    border: 1px solid rgba(239,68,68,0.5);
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  }
  .dup-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(160,109,255,0.2); color: #cbb0ff;
    border: 1px solid rgba(160,109,255,0.5);
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  }
  .card .body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card .name { font-size: 14px; font-weight: 700; line-height: 1.25; }
  .card .meta { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
  .card .flags { font-size: 11px; color: var(--warn); }
  .card .actions { margin-top: auto; padding-top: 9px; display: flex; flex-direction: column; gap: 6px; }
  .btn {
    display: block; width: 100%; text-align: center; padding: 8px 10px;
    border-radius: 9px; font-size: 12px; font-weight: 700; border: 1px solid var(--border);
    cursor: pointer; text-decoration: none; background: var(--panel2); color: var(--text);
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.98); }
  .btn.has-link {
    background: linear-gradient(135deg, rgba(109,141,255,0.22), rgba(160,109,255,0.14));
    border-color: rgba(109,141,255,0.5); color: var(--accent);
  }
  .btn.placeholder { color: var(--text-dim); }
  .btn.placeholder:hover { color: var(--text); border-color: var(--accent); }
  .btn.danger { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: var(--danger); }
  .btn.danger:hover { background: rgba(239,68,68,0.22); }
  .link-row { display: flex; gap: 6px; }
  .link-row .edit-btn, .link-row .remove-btn {
    flex: none; font-size: 11px; padding: 6px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text-dim); cursor: pointer;
  }
  .link-row .edit-btn:hover, .link-row .remove-btn:hover { color: var(--text); }
  .not-listed { text-align: center; padding: 8px 0; font-size: 12px; color: var(--text-dim); }
  .empty-state { text-align: center; color: var(--text-dim); padding: 80px 20px; font-size: 15px; }
  .modal-overlay, .lightbox-overlay {
    position: fixed; inset: 0; background: rgba(6,7,10,0.75); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  .lightbox-overlay { z-index: 300; cursor: zoom-out; background: rgba(4,5,7,0.92); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-box {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--border); border-radius: 16px; padding: 22px;
    width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
    animation: popIn 0.18s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-box h3 { margin: 0 0 6px 0; font-size: 17px; }
  .modal-box label { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .modal-box input {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 11px; border-radius: 9px; font-size: 14px; width: 100%;
  }
  .modal-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .modal-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .photo-edit-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .photo-preview { width: 56px; height: 74px; object-fit: cover; border-radius: 7px; border: 1px solid var(--border); background: var(--bg2); flex: none; }
  .photo-preview-empty { width: 56px; height: 74px; border-radius: 7px; border: 1px dashed var(--border); background: var(--bg2); flex: none; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-dim); text-align: center; padding: 2px; }
  .photo-edit-btns { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .photo-edit-btns .btn { width: 100%; }
  .modal-actions .btn { flex: 1; min-width: 90px; }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .stats-table th, .stats-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  .stats-table th { color: var(--text-dim); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .stats-table tr:last-child td { font-weight: 800; border-bottom: none; padding-top: 10px; }
  .lightbox-content {
    max-width: min(90vw, 700px); max-height: 85vh; display: flex; flex-direction: column;
    align-items: center; gap: 12px; cursor: default; animation: popIn 0.18s ease;
  }
  .lightbox-content img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); }
  .lightbox-caption { color: var(--text); font-size: 14px; text-align: center; }
  .lightbox-close {
    position: absolute; top: 18px; right: 24px; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); font-size: 20px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 18px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 1;
  }
  .lightbox-nav:hover { background: rgba(0,0,0,0.6); }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  .lightbox-dots { display: flex; gap: 6px; justify-content: center; }
  .lightbox-dots .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35); cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; }
  .lightbox-dots .dot.active { background: #fff; transform: scale(1.25); }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; padding: 24px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>David's Collection</h1>
  <div class="sub">492 cards. Click any photo for a closer look.</div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search by player, set, or year...">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <select id="sortBy">
      <option value="value-desc">Value: high to low</option>
      <option value="value-asc">Value: low to high</option>
      <option value="name-asc">Name: A to Z</option>
      <option value="year-desc">Year: newest first</option>
    </select>
    <label class="check-label"><input type="checkbox" id="listedOnly"> Listed only</label>
    <label class="check-label"><input type="checkbox" id="favoritesOnly"> ⭐ Favorites only</label>
    <label class="check-label"><input type="checkbox" id="duplicatesOnly"> Duplicates only</label>
    <label class="check-label admin-only" id="showDeletedLabel"><input type="checkbox" id="showDeleted"> <span id="showDeletedText">Show deleted</span></label>
    <button class="icon-btn" id="themeBtn">🌙 Dark Mode</button>
    <button class="icon-btn admin-only" id="statsBtn">📊 Stats</button>
    <button class="icon-btn admin-only" id="exportBtn">⬇ Export CSV</button>
    <button class="icon-btn admin-only" id="refreshBtn">🔄 Refresh Data</button>
    <input type="file" id="refreshFileInput" accept=".csv" style="display:none;">
    <button class="lock-btn" id="lockBtn">🔒 Admin Login</button>
    <div class="stats">
      <span>Showing <b id="shownCount">0</b> of <b id="totalCount">0</b></span>
      <span id="totalValueStat" style="display:none;">Total est. value: <b id="totalValue">$0</b></span>
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No cards match your filters.</div>
</main>
<footer>Data from your CollX export. Values are CollX estimates, not guaranteed sale prices &mdash; verify anything valuable against real sold comps before pricing it.</footer>

// ---------- shared state (synced across all visitors/devices via serverless API + Blob storage) ----------
let STATE = { edits: {}, links: {}, deleted: {}, photos: {}, importedCards: null };

async function loadState() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (r.ok) STATE = await r.json();
  } catch (e) { console.error("Failed to load shared state:", e); }
}

async function mutateState(action, cardId, payload) {
  const token = getAdminToken();
  if (!token) { alert("You're not logged in as admin (or your session expired). Please log in again."); return false; }
  try {
    const r = await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, action, cardId, payload })
    });
    if (r.status === 401) { alert("Your admin session expired. Please log in again."); lockEditing(); return false; }
    if (!r.ok) { alert("Couldn't save that change. Please try again."); return false; }
    const data = await r.json();
    STATE = data.state;
    return true;
  } catch (e) {
    alert("Couldn't reach the server to save that change. Check your connection and try again.");
    return false;
  }
}

function getLinks() { return STATE.links || {}; }
async function setLink(id, url) { return mutateState("setLink", id, { url }); }

function getEdits() { return STATE.edits || {}; }
async function setEdit(id, fields) { return mutateState("setEdit", id, { fields }); }
async function clearEdit(id) { return mutateState("clearEdit", id, {}); }

function getDeleted() { return STATE.deleted || {}; }
async function setDeleted(id, v) { return mutateState("setDeleted", id, { value: v }); }

const FAVORITE_KEY = "card_collection_favorites_v1"; // per-visitor — stays in this browser only
function getFavorites() { try { return JSON.parse(localStorage.getItem(FAVORITE_KEY) || "{}"); } catch(e) { return {}; } }
function toggleFavorite(id) { const f = getFavorites(); if (f[id]) { delete f[id]; } else { f[id] = true; } localStorage.setItem(FAVORITE_KEY, JSON.stringify(f)); }

function getImportedCards() { return STATE.importedCards || null; }
async function setImportedCards(arr) { return mutateState("setImportedCards", null, { cards: arr }); }
function getBaseCards() { const imp = getImportedCards(); return (imp && imp.length) ? imp : CARDS; }

const THEME_KEY = "card_collection_theme_v1"; // per-visitor — stays in this browser only
function getTheme() { return localStorage.getItem(THEME_KEY) || "dark"; }
function applyTheme() {
  const theme = getTheme();
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = theme === "light" ? "🌙 Dark Mode" : "☀️ Light Mode";
}
function toggleTheme() {
  localStorage.setItem(THEME_KEY, getTheme() === "light" ? "dark" : "light");
  applyTheme();
}

// ---------- per-card front/back photos (admin uploaded, stored in Vercel Blob, shared with all visitors) ----------
function getPhotos() { return STATE.photos || {}; }
async function setCardPhoto(id, side, dataUri) {
  const token = getAdminToken();
  if (!token) { alert("You're not logged in as admin (or your session expired). Please log in again."); return false; }
  try {
    const r = await fetch("/api/photo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, cardId: id, side, imageBase64: dataUri || null })
    });
    if (r.status === 401) { alert("Your admin session expired. Please log in again."); lockEditing(); return false; }
    if (!r.ok) { alert("Couldn't save that photo. Please try again with a smaller image."); return false; }
    const data = await r.json();
    STATE = data.state;
    return true;
  } catch (e) {
    alert("Couldn't reach the server to save that photo. Check your connection and try again.");
    return false;
  }
}
function getCardImages(c) {
  const p = getPhotos()[c.id] || {};
  const imgs = [];
  if (p.front) imgs.push({ src: p.front, label: "Front" });
  else if (c.img) imgs.push({ src: c.img, label: "Front" });
  if (p.back) imgs.push({ src: p.back, label: "Back" });
  return imgs;
}
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w >= h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Couldn't read that image file."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

// ---------- image carousel (front/back), Instagram-style swipe + dots ----------
function buildImageArea(c) {
  const imgWrap = document.createElement("div");
  imgWrap.className = "imgwrap";
  const images = getCardImages(c);
  if (images.length === 0) {
    const noimg = document.createElement("div");
    noimg.className = "noimg";
    noimg.textContent = "No image";
    imgWrap.appendChild(noimg);
    return imgWrap;
  }
  let idx = 0;
  const imgEl = document.createElement("img");
  imgEl.src = images[0].src;
  imgEl.loading = "lazy";
  imgEl.alt = c.displayName + " - " + images[0].label;
  imgWrap.appendChild(imgEl);

  let dotsEl = null;
  function show(i) {
    idx = (i + images.length) % images.length;
    imgEl.src = images[idx].src;
    imgEl.alt = c.displayName + " - " + images[idx].label;
    if (dotsEl) Array.from(dotsEl.children).forEach((d, di) => d.classList.toggle("active", di === idx));
  }

  imgEl.onclick = (ev) => {
    const rect = imgWrap.getBoundingClientRect();
    const frac = (ev.clientX - rect.left) / rect.width;
    if (images.length > 1 && frac < 0.18) { show(idx - 1); return; }
    if (images.length > 1 && frac > 0.82) { show(idx + 1); return; }
    openLightbox(c.displayName + (c.displayMeta ? " — " + c.displayMeta : ""), images, idx);
  };

  let touchStartX = null;
  imgWrap.addEventListener("touchstart", (ev) => { touchStartX = ev.touches[0].clientX; }, { passive: true });
  imgWrap.addEventListener("touchend", (ev) => {
    if (touchStartX === null || images.length < 2) return;
    const dx = ev.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 35) show(dx < 0 ? idx + 1 : idx - 1);
    touchStartX = null;
  }, { passive: true });

  if (images.length > 1) {
    dotsEl = document.createElement("div");
    dotsEl.className = "carousel-dots";
    images.forEach((im, di) => {
      const dot = document.createElement("span");
      dot.className = "dot" + (di === 0 ? " active" : "");
      dot.onclick = (ev) => { ev.stopPropagation(); show(di); };
      dotsEl.appendChild(dot);
    });
    imgWrap.appendChild(dotsEl);
  }
  return imgWrap;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}

// ---------- admin login (verified server-side; issues a signed session token) ----------
const TOKEN_KEY = "card_collection_admin_token";
function getAdminToken() { return sessionStorage.getItem(TOKEN_KEY) || null; }
function isUnlocked() { return !!getAdminToken(); }
async function tryUnlock() {
  const pw = window.prompt("Enter the admin password:");
  if (pw === null) return false;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    });
    if (!r.ok) { alert("Incorrect password."); return false; }
    const data = await r.json();
    sessionStorage.setItem(TOKEN_KEY, data.token);
    updateLockUI();
    return true;
  } catch (e) {
    alert("Couldn't reach the server to log in. Check your connection and try again.");
    return false;
  }
}
function lockEditing() { sessionStorage.removeItem(TOKEN_KEY); updateLockUI(); render(); }

function updateLockUI() {
  const btn = document.getElementById("lockBtn");
  const unlocked = isUnlocked();
  document.getElementById("totalValueStat").style.display = unlocked ? "" : "none";
  document.querySelectorAll(".admin-only").forEach(el => { el.style.display = unlocked ? (el.tagName === "LABEL" ? "flex" : "inline-block") : "none"; });
  if (unlocked) { btn.textContent = "🔓 Admin (click to log out)"; btn.classList.add("unlocked"); }
  else { btn.textContent = "🔒 Admin Login"; btn.classList.remove("unlocked"); document.getElementById("showDeleted").checked = false; }

}

// ---------- element refs ----------
const grid = document.getElementById("grid");
const searchInput = document.getElementById("search");
const categorySelect = document.getElementById("categoryFilter");
const sortSelect = document.getElementById("sortBy");
const listedOnlyCheck = document.getElementById("listedOnly");
const favoritesOnlyCheck = document.getElementById("favoritesOnly");
const duplicatesOnlyCheck = document.getElementById("duplicatesOnly");
const showDeletedCheck = document.getElementById("showDeleted");
const emptyState = document.getElementById("emptyState");
const shownCountEl = document.getElementById("shownCount");
const totalCountEl = document.getElementById("totalCount");
const totalValueEl = document.getElementById("totalValue");

function rebuildCategoryOptions() {
  const current = categorySelect.value;
  const cats = [...new Set(getBaseCards().map(c => c.category))].sort();
  categorySelect.innerHTML = '<option value="">All categories</option>';
  for (const cat of cats) {
    const opt = document.createElement("option");
    opt.value = cat; opt.textContent = cat;
    categorySelect.appendChild(opt);
  }
  if (cats.includes(current)) categorySelect.value = current;
}

function cardLabel(c) { return [c.year, c.brand, c.set].filter(Boolean).join(" "); }
function fmtMoney(v) { if (v === null || v === undefined) return "N/A"; return "$" + v.toFixed(2); }

function computeDuplicateIds(cards, deleted) {
  const sigCount = {};
  const sigOf = c => [String(c.name||"").toLowerCase(), c.year, String(c.brand||"").toLowerCase(), String(c.set||"").toLowerCase(), c.number].join("|");
  for (const c of cards) { if (deleted[c.id]) continue; const s = sigOf(c); sigCount[s] = (sigCount[s]||0)+1; }
  const dup = new Set();
  for (const c of cards) {
    if (deleted[c.id]) continue;
    if (sigCount[sigOf(c)] > 1 || (c.qty && c.qty > 1)) dup.add(c.id);
  }
  return dup;
}

// ---------- main render ----------
function render() {
  const q = searchInput.value.trim().toLowerCase();
  const cat = categorySelect.value;
  const sort = sortSelect.value;
  const listedOnly = listedOnlyCheck.checked;
  const favoritesOnly = favoritesOnlyCheck.checked;
  const duplicatesOnly = duplicatesOnlyCheck.checked;
  const unlocked = isUnlocked();
  const showDeleted = unlocked && showDeletedCheck.checked;
  const links = getLinks();
  const edits = getEdits();
  const deleted = getDeleted();
  const favorites = getFavorites();
  const baseCards = getBaseCards();
  const dupIds = computeDuplicateIds(baseCards, deleted);

  const viewCards = baseCards.map(c => {
    const e = edits[c.id] || null;
    const displayName = (e && e.name) ? e.name : c.name;
    const displayMeta = (e && e.meta) ? e.meta : (cardLabel(c) + (c.number ? " #" + c.number : ""));
    const displayValue = (e && e.value !== undefined && e.value !== null) ? e.value : c.value;
    return { ...c, displayName, displayMeta, displayValue, edited: !!e,
             isDeleted: !!deleted[c.id], isFavorite: !!favorites[c.id], isDuplicate: dupIds.has(c.id) };
  });

  const activeCards = viewCards.filter(c => !c.isDeleted);
  const deletedCount = viewCards.length - activeCards.length;
  const sdText = document.getElementById("showDeletedText");
  if (sdText) sdText.textContent = "Show deleted (" + deletedCount + ")";

  let pool = showDeleted ? viewCards : activeCards;

  let filtered = pool.filter(c => {
    if (cat && c.category !== cat) return false;
    if (listedOnly && !links[c.id]) return false;
    if (favoritesOnly && !c.isFavorite) return false;
    if (duplicatesOnly && !c.isDuplicate) return false;
    if (q) {
      const hay = [c.displayName, c.displayMeta, c.brand, c.team, String(c.year || "")].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    if (a.isDeleted !== b.isDeleted) return a.isDeleted ? 1 : -1;
    if (sort === "value-desc") return (b.displayValue || 0) - (a.displayValue || 0);
    if (sort === "value-asc") return (a.displayValue || 0) - (b.displayValue || 0);
    if (sort === "name-asc") return a.displayName.localeCompare(b.displayName);
    if (sort === "year-desc") return (b.year || 0) - (a.year || 0);
    return 0;
  });

  grid.innerHTML = "";
  let totalVal = 0;
  for (const c of activeCards) { totalVal += (c.displayValue || 0); }
  totalValueEl.textContent = fmtMoney(totalVal);
  totalCountEl.textContent = activeCards.length;
  shownCountEl.textContent = filtered.filter(c => !c.isDeleted).length;
  emptyState.style.display = filtered.length ? "none" : "block";

  for (const c of filtered) {
    const el = document.createElement("div");
    el.className = "card" + (c.isDeleted ? " is-deleted" : "");

    const imgWrap = buildImageArea(c);

    const favBtn = document.createElement("button");
    favBtn.className = "fav-btn" + (c.isFavorite ? " active" : "");
    favBtn.textContent = c.isFavorite ? "★" : "☆";
    favBtn.title = c.isFavorite ? "Remove from favorites" : "Add to favorites";
    favBtn.onclick = () => { toggleFavorite(c.id); render(); };
    imgWrap.appendChild(favBtn);

    if (c.displayValue !== null && c.displayValue !== undefined) {
      const valBadge = document.createElement("div");
      valBadge.className = "value-badge";
      valBadge.textContent = fmtMoney(c.displayValue);
      imgWrap.appendChild(valBadge);
    }
    if (c.edited) {
      const editedBadge = document.createElement("div");
      editedBadge.className = "edited-badge";
      editedBadge.textContent = "Edited";
      editedBadge.title = "Corrected by the collection owner";
      imgWrap.appendChild(editedBadge);
    }
    if (c.isDeleted) {
      const delBadge = document.createElement("div");
      delBadge.className = "deleted-badge";
      delBadge.textContent = "Deleted";
      imgWrap.appendChild(delBadge);
    } else if (c.isDuplicate) {
      const dupBadge = document.createElement("div");
      dupBadge.className = "dup-badge";
      dupBadge.textContent = "Duplicate";
      imgWrap.appendChild(dupBadge);
    }
    el.appendChild(imgWrap);

    const body = document.createElement("div");
    body.className = "body";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = c.displayName + (c.qty > 1 ? " (x" + c.qty + ")" : "");
    body.appendChild(name);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = c.displayMeta;
    body.appendChild(meta);

    if (c.flags || c.condition) {
      const flags = document.createElement("div");
      flags.className = "flags";
      flags.textContent = [c.flags, c.condition].filter(Boolean).join(" · ");
      body.appendChild(flags);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    if (c.isDeleted) {
      const restoreBtn = document.createElement("button");
      restoreBtn.className = "btn has-link";
      restoreBtn.textContent = "↩️ Restore Card";
      restoreBtn.onclick = async () => { await setDeleted(c.id, false); render(); };
      actions.appendChild(restoreBtn);
    } else {
      const linkUrl = links[c.id];
      if (linkUrl) {
        const a = document.createElement("a");
        a.className = "btn has-link";
        a.href = linkUrl;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "View eBay Listing ↗";
        actions.appendChild(a);
        if (unlocked) {
          const row = document.createElement("div");
          row.className = "link-row";
          const editBtn = document.createElement("button");
          editBtn.className = "edit-btn";
          editBtn.textContent = "Edit Link";
          editBtn.onclick = () => promptForLink(c.id);
          const removeBtn = document.createElement("button");
          removeBtn.className = "remove-btn";
          removeBtn.textContent = "Remove";
          removeBtn.onclick = async () => { await setLink(c.id, null); render(); };
          row.appendChild(editBtn); row.appendChild(removeBtn);
          actions.appendChild(row);
        }
      } else if (unlocked) {
        const btn = document.createElement("button");
        btn.className = "btn placeholder";
        btn.textContent = "+ Add eBay Listing Link";
        btn.onclick = () => promptForLink(c.id);
        actions.appendChild(btn);
      } else {
        const notListed = document.createElement("div");
        notListed.className = "not-listed";
        notListed.textContent = "Not listed yet";
        actions.appendChild(notListed);
      }

      if (unlocked) {
        const editCardBtn = document.createElement("button");
        editCardBtn.className = "btn placeholder edit-card-btn";
        editCardBtn.textContent = "✏️ Edit Card Name / Price";
        editCardBtn.onclick = () => openEditModal(c.id);
        actions.appendChild(editCardBtn);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn danger";
        deleteBtn.textContent = "🗑️ Delete Card";
        deleteBtn.onclick = async () => {
          if (confirm('Delete "' + c.displayName + '" from the collection view? You can restore it later from "Show deleted" while logged in as admin.')) {
            await setDeleted(c.id, true); render();
          }
        };
        actions.appendChild(deleteBtn);
      }
    }

    body.appendChild(actions);
    el.appendChild(body);
    grid.appendChild(el);
  }
}

// ---------- edit card modal ----------
function openEditModal(id) {
  const c = getBaseCards().find(x => x.id === id);
  if (!c) return;
  const edits = getEdits();
  const e = edits[id] || null;
  const curName = (e && e.name) ? e.name : c.name;
  const curMeta = (e && e.meta) ? e.meta : (cardLabel(c) + (c.number ? " #" + c.number : ""));
  const curValue = (e && e.value !== undefined && e.value !== null) ? e.value : c.value;
  const photos = getPhotos()[id] || {};
  const frontSrc = photos.front || c.img || "";
  const backSrc = photos.back || "";

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Edit Card</h3>
      <div class="modal-hint">CollX sometimes misreads a parallel from a low-quality scan photo &mdash; fix it here. Changes are saved in this browser only.</div>
      <label for="editNameInput">Player / Card Name</label>
      <input type="text" id="editNameInput" value="${escapeHtml(curName)}">
      <label for="editMetaInput">Year / Set / Parallel Description</label>
      <input type="text" id="editMetaInput" value="${escapeHtml(curMeta)}">
      <label for="editValueInput">Value ($)</label>
      <input type="number" id="editValueInput" step="0.01" min="0" value="${curValue !== null && curValue !== undefined ? curValue : ""}">
      <label>Front Photo</label>
      <div class="photo-edit-row">
        ${frontSrc ? `<img class="photo-preview" src="${frontSrc}" alt="Front preview">` : '<div class="photo-preview photo-preview-empty">No photo</div>'}
        <div class="photo-edit-btns">
          <button type="button" id="frontPhotoUploadBtn" class="btn placeholder">${photos.front ? "Replace" : "Upload"}</button>
          ${photos.front ? '<button type="button" id="frontPhotoRemoveBtn" class="btn danger">Remove</button>' : ""}
        </div>
        <input type="file" id="frontPhotoInput" accept="image/*" style="display:none;">
      </div>
      <label>Back Photo</label>
      <div class="photo-edit-row">
        ${backSrc ? `<img class="photo-preview" src="${backSrc}" alt="Back preview">` : '<div class="photo-preview photo-preview-empty">No photo</div>'}
        <div class="photo-edit-btns">
          <button type="button" id="backPhotoUploadBtn" class="btn placeholder">${photos.back ? "Replace" : "Upload"}</button>
          ${photos.back ? '<button type="button" id="backPhotoRemoveBtn" class="btn danger">Remove</button>' : ""}
        </div>
        <input type="file" id="backPhotoInput" accept="image/*" style="display:none;">
      </div>
      <div class="modal-actions">
        <button id="editSaveBtn" class="btn has-link">Save</button>
        ${ e ? '<button id="editResetBtn" class="btn placeholder">Reset Text to Original</button>' : "" }
        <button id="editCancelBtn" class="btn placeholder">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) overlay.remove(); });
  document.getElementById("editCancelBtn").onclick = () => overlay.remove();
  document.getElementById("editSaveBtn").onclick = async () => {
    const nameVal = document.getElementById("editNameInput").value.trim();
    const metaVal = document.getElementById("editMetaInput").value.trim();
    const valueRaw = document.getElementById("editValueInput").value;
    const valueVal = valueRaw === "" ? null : parseFloat(valueRaw);
    const origMeta = cardLabel(c) + (c.number ? " #" + c.number : "");
    const newEdit = {};
    if (nameVal && nameVal !== c.name) newEdit.name = nameVal;
    if (metaVal && metaVal !== origMeta) newEdit.meta = metaVal;
    if (valueVal !== null && !isNaN(valueVal) && valueVal !== c.value) newEdit.value = valueVal;
    const saveBtn = document.getElementById("editSaveBtn");
    saveBtn.disabled = true; saveBtn.textContent = "Saving...";
    if (Object.keys(newEdit).length) { await setEdit(id, newEdit); } else { await clearEdit(id); }
    overlay.remove(); render();
  };
  const resetBtn = document.getElementById("editResetBtn");
  if (resetBtn) resetBtn.onclick = async () => { resetBtn.disabled = true; resetBtn.textContent = "Resetting..."; await clearEdit(id); overlay.remove(); render(); };

  function wirePhotoSide(side, uploadBtnId, inputId, removeBtnId) {
    const uploadBtn = document.getElementById(uploadBtnId);
    const input = document.getElementById(inputId);
    if (uploadBtn && input) {
      uploadBtn.onclick = () => input.click();
      input.onchange = async (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        uploadBtn.textContent = "Uploading...";

  wirePhotoSide("front", "frontPhotoUploadBtn", "frontPhotoInput", "frontPhotoRemoveBtn");
  wirePhotoSide("back", "backPhotoUploadBtn", "backPhotoInput", "backPhotoRemoveBtn");
}

// ---------- listing link prompt ----------
async function promptForLink(id) {
  if (!isUnlocked()) {
    alert("Editing is locked. Only the collection owner can add or change eBay listing links.\n\nIf this is your collection, click \"🔒 Admin Login\" at the top of the page and enter the password.");
    return;
  }
  const links = getLinks();
  const current = links[id] || "";
  const url = window.prompt("Paste the eBay listing URL for this card:", current);
  if (url === null) return;
  const trimmed = url.trim();
  if (trimmed && !/^https?:\/\//i.test(trimmed)) { alert("Please enter a full URL starting with http:// or https://"); return; }
  await setLink(id, trimmed || null);
  render();
}

// ---------- lightbox ----------
function openLightbox(caption, images, startIndex) {
  if (!images || !images.length) return;
  let idx = startIndex || 0;
  const multi = images.length > 1;
  const overlay = document.createElement("div");
  overlay.className = "lightbox-overlay";
  overlay.innerHTML = `
    <button class="lightbox-close" aria-label="Close">&times;</button>
    ${multi ? '<button class="lightbox-nav lightbox-prev" aria-label="Previous photo">&#10094;</button><button class="lightbox-nav lightbox-next" aria-label="Next photo">&#10095;</button>' : ""}
    <div class="lightbox-content">
      <img src="${images[idx].src}" alt="${escapeHtml(caption || "")}">
      <div class="lightbox-caption">${escapeHtml(caption || "")}${multi ? " · " + escapeHtml(images[idx].label) : ""}</div>
      ${multi ? '<div class="carousel-dots lightbox-dots"></div>' : ""}
    </div>`;
  document.body.appendChild(overlay);
  const imgTag = overlay.querySelector(".lightbox-content img");
  const captionTag = overlay.querySelector(".lightbox-caption");
  const dotsWrap = overlay.querySelector(".lightbox-dots");
  if (dotsWrap) {
    images.forEach((im, di) => {
      const dot = document.createElement("span");
      dot.className = "dot" + (di === idx ? " active" : "");
      dot.onclick = (ev) => { ev.stopPropagation(); show(di); };
      dotsWrap.appendChild(dot);
    });
  }
  function show(i) {
    idx = (i + images.length) % images.length;
    imgTag.src = images[idx].src;
    captionTag.textContent = (caption || "") + (multi ? " · " + images[idx].label : "");
    if (dotsWrap) Array.from(dotsWrap.children).forEach((d, di) => d.classList.toggle("active", di === idx));
  }
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => {
    if (ev.key === "Escape") close();
    else if (multi && ev.key === "ArrowLeft") show(idx - 1);
    else if (multi && ev.key === "ArrowRight") show(idx + 1);
  };
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) close(); });
  overlay.querySelector(".lightbox-close").addEventListener("click", close);
  const prevBtn = overlay.querySelector(".lightbox-prev");
  const nextBtn = overlay.querySelector(".lightbox-next");
  if (prevBtn) prevBtn.addEventListener("click", (ev) => { ev.stopPropagation(); show(idx - 1); });
  if (nextBtn) nextBtn.addEventListener("click", (ev) => { ev.stopPropagation(); show(idx + 1); });
  let touchStartX = null;
  const content = overlay.querySelector(".lightbox-content");
  content.addEventListener("touchstart", (ev) => { touchStartX = ev.touches[0].clientX; }, { passive: true });
  content.addEventListener("touchend", (ev) => {
    if (touchStartX === null || !multi) return;
    const dx = ev.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) show(dx < 0 ? idx + 1 : idx - 1);
    touchStartX = null;
  }, { passive: true });
  document.addEventListener("keydown", onKey);
}

// ---------- stats modal (admin only) ----------
function openStatsModal() {
  const edits = getEdits();
  const deleted = getDeleted();
  const active = getBaseCards().filter(c => !deleted[c.id]);
  const byCat = {};
  let grandTotal = 0, grandCount = 0;
  for (const c of active) {
    const e = edits[c.id] || null;
    const val = (e && e.value !== undefined && e.value !== null) ? e.value : (c.value || 0);
    if (!byCat[c.category]) byCat[c.category] = { count: 0, value: 0 };
    byCat[c.category].count += 1;
    byCat[c.category].value += val;
    grandCount += 1;
    grandTotal += val;
  }
  const rows = Object.entries(byCat).sort((a,b) => b[1].value - a[1].value)
    .map(([cat, s]) => `<tr><td>${escapeHtml(cat)}</td><td>${s.count}</td><td>${fmtMoney(s.value)}</td></tr>`).join("");

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>📊 Collection Stats</h3>
      <table class="stats-table">
        <thead><tr><th>Category</th><th>Cards</th><th>Est. Value</th></tr></thead>
        <tbody>${rows}<tr><td>Total</td><td>${grandCount}</td><td>${fmtMoney(grandTotal)}</td></tr></tbody>
      </table>
      <div class="modal-actions"><button id="statsCloseBtn" class="btn placeholder">Close</button></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) overlay.remove(); });
  document.getElementById("statsCloseBtn").onclick = () => overlay.remove();
}

// ---------- CSV export of current filtered view (admin only) ----------
function exportCsv() {
  const q = searchInput.value.trim().toLowerCase();
  const cat = categorySelect.value;
  const listedOnly = listedOnlyCheck.checked;
  const favoritesOnly = favoritesOnlyCheck.checked;
  const duplicatesOnly = duplicatesOnlyCheck.checked;
  const links = getLinks();
  const edits = getEdits();
  const deleted = getDeleted();
  const favorites = getFavorites();
  const baseCards = getBaseCards();
  const dupIds = computeDuplicateIds(baseCards, deleted);

  const rows = [["Name","Year","Brand","Set","Number","Category","Condition","Value","Listing URL","Favorite","Duplicate"]];
  for (const c of baseCards) {
    if (deleted[c.id]) continue;
    const e = edits[c.id] || null;
    const displayName = (e && e.name) ? e.name : c.name;
    const displayMeta = (e && e.meta) ? e.meta : (cardLabel(c) + (c.number ? " #" + c.number : ""));
    const displayValue = (e && e.value !== undefined && e.value !== null) ? e.value : c.value;
    if (cat && c.category !== cat) continue;
    if (listedOnly && !links[c.id]) continue;
    if (favoritesOnly && !favorites[c.id]) continue;
    if (duplicatesOnly && !dupIds.has(c.id)) continue;
    if (q) {
      const hay = [displayName, displayMeta, c.brand, c.team, String(c.year||"")].join(" ").toLowerCase();
      if (!hay.includes(q)) continue;
    }
    rows.push([displayName, c.year||"", c.brand||"", c.set||"", c.number||"", c.category||"",
               c.condition||"", displayValue !== null && displayValue !== undefined ? displayValue.toFixed(2) : "",
               links[c.id]||"", favorites[c.id] ? "yes" : "no", dupIds.has(c.id) ? "yes" : "no"]);
  }
  const csv = rows.map(r => r.map(field => {
    const s = String(field);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "davids-collection-export.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------- refresh / re-import CollX CSV (admin only) ----------
function mapCsvRowToCard(row, idx) {
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const yearNum = v => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };
  return {
    id: row["collx_id"] || ("row-" + idx),
    name: row["name"] || "Unknown",
    team: row["team"] || null,
    year: yearNum(row["year"]),
    brand: row["brand"] || null,
    set: row["set"] || null,
    number: row["number"] || null,
    category: row["category"] || "Other",
    flags: row["flags"] || null,
    condition: row["condition"] || null,
    value: num(row["market_value"]),
    img: row["front_image"] || null,
    qty: parseInt(row["quantity"], 10) || 1
  };
}

function handleRefreshFile(file) {
  if (!file) return;
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: async (results) => {
      const rows = results.data;
      if (!rows.length) { alert("That file didn't have any rows I could read."); return; }
      const cards = rows.map((r, i) => mapCsvRowToCard(r, i));
      const ok = await setImportedCards(cards);
      if (!ok) return;
      rebuildCategoryOptions();
      render();
      alert("Imported " + cards.length + " cards from the new file. Your existing edits, links, favorites, and deletions carry over automatically wherever the card IDs match, and this is now visible to everyone who visits the site.");
    },
    error: (err) => { alert("Couldn't read that CSV: " + err.message); }
  });
}

// ---------- wire up events ----------
searchInput.addEventListener("input", render);
categorySelect.addEventListener("change", render);
sortSelect.addEventListener("change", render);
listedOnlyCheck.addEventListener("change", render);
favoritesOnlyCheck.addEventListener("change", render);
duplicatesOnlyCheck.addEventListener("change", render);
showDeletedCheck.addEventListener("change", render);
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("lockBtn").addEventListener("click", () => { if (isUnlocked()) { lockEditing(); } else { tryUnlock(); } });
document.getElementById("statsBtn").addEventListener("click", () => { if (isUnlocked()) openStatsModal(); });
document.getElementById("exportBtn").addEventListener("click", () => { if (isUnlocked()) exportCsv(); });
document.getElementById("refreshBtn").addEventListener("click", () => {
  if (!isUnlocked()) return;
  document.getElementById("refreshFileInput").click();
});
document.getElementById("refreshFileInput").addEventListener("change", (ev) => {
  handleRefreshFile(ev.target.files[0]);
  ev.target.value = "";
});

  grid.innerHTML = '<div style="grid-column:1/-1;padding:40px 0;text-align:center;color:var(--text-dim);">Loading collection…</div>';
  await loadState();
  rebuildCategoryOptions();
  applyTheme();
  updateLockUI();
}
init();
